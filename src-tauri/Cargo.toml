[package]
name = "pomodoro-task"
version = "0.1.0"
description = "Gestor de tareas diarias + Pomodoro, minimalista, optimizado para TDAH (Fase 1: RAM-only)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
